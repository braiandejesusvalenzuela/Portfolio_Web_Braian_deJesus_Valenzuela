<section id="proyectos" class="proyectos">

    <div class="proyectos-container">

        <!-- ENCABEZADO -->

        <div class="proyectos-header">

            <h2 class="section-title">
        <span class="section-title-icon">
        <img
            src="/icons/folder.svg"
            alt=""
            aria-hidden="true">
        </span>
        <span>
                {{ textos.titulo }}
        </span>

            </h2>

        </div>


        <!-- PROYECTO -->

        <article class="proyecto-card">

       

            <!-- CONTENIDO -->

            <div class="proyecto-content">



                <!-- TÍTULO -->

                <h3 class="proyecto-titulo">
                    Conandoydle
                </h3>
                <!-- SUBTÍTULO -->

                <span class="proyecto-tipo">
                  {{ textos.tipo }}
                </span>


                <!-- TECNOLOGÍAS -->

                <div class="proyecto-tecnologias">

                    <div class="proyecto-tecnologia">

                        <img
                            src="/icons/technologies/python.svg"
                            alt="Python">

                        <span>
                            Python
                        </span>

                    </div>


                    <div class="proyecto-tecnologia">

                        <img
                            src="/icons/technologies/vscode.svg"
                            alt="Visual Studio Code">

                        <span>
                            Visual Studio Code
                        </span>

                    </div>

                </div>


                <!-- DESCRIPCIÓN -->

                <p class="proyecto-descripcion">

                {{ textos.descripcion }}

                </p>


                <!-- BOTÓN -->

                <div class="proyecto-acciones">

                    <a
                        href="https://www.online-python.com/rWM7I3Zfx5"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="proyecto-btn">

                        {{ textos.boton }}

                    </a>

                </div>

            </div>

        </article>

    </div>

</section>
