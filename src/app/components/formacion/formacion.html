<section id="formacion" class="formacion">

    <div class="formacion-container">

        <!-- ==========================
             ENCABEZADO
        =========================== -->

        <div class="formacion-header">

            <h2 class="section-title">
            <span class="section-title-icon">
        <img
            src="/icons/graduation.svg"
            alt=""
            aria-hidden="true">
        </span>

        <span>
                {{ textos.titulo }}
           </span>
            </h2>

        </div>


        <!-- ==========================
             CONTENIDO
        =========================== -->

        <div class="formacion-grid">


            <!-- ==========================
                 FORMACIÓN ACADÉMICA
            =========================== -->

            <article class="formacion-card">

                <div class="formacion-card-header">

                    <span class="formacion-etiqueta">
                     {{ textos.academica }}
                    </span>

                </div>


                <div class="formacion-contenido">

                    <h3 class="formacion-institucion">
                        IFTS 21
                    </h3>

                    <h4 class="formacion-carrera">
                    {{ textos.carrera }}
                    </h4>

                    <span class="formacion-fecha">
                     2025 — {{ textos.presente }}
                    </span>

                    <p class="formacion-detalle">
                     {{ textos.segundoAnio }}
                    </p>

                </div>

            </article>



            <!-- ==========================
                 FORMACIÓN COMPLEMENTARIA
            =========================== -->

            <article class="formacion-card">

                <div class="formacion-card-header">

                    <span class="formacion-etiqueta">
                    {{ textos.complementaria }}
                    </span>

                </div>


                <div class="formacion-contenido">

                    <div class="formacion-item">

                        <h3 class="formacion-institucion">
                            Udemy
                        </h3>

                        <span class="formacion-complementaria">
                        {{ textos.cursos }}
                        </span>

                    </div>


                    <div class="formacion-item">

                        <h3 class="formacion-institucion">
                            UTN
                        </h3>

                        <span class="formacion-complementaria">
                            {{ textos.formacionComplementaria }}
                        </span>

                    </div>

                </div>

            </article>


        </div>

    </div>

</section>
